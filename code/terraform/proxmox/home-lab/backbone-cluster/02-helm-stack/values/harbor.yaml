# Harbor container registry.
# Chart: https://helm.goharbor.io
# Install:
#   helm repo add harbor https://helm.goharbor.io
#   helm install harbor harbor/harbor -n harbor --create-namespace -f harbor.yaml
#
# Exposure: clusterIP + TLS off — backbone-gateway terminates TLS and routes to
# harbor's own nginx proxy (NOT harbor-core directly: nginx applies
# client_max_body_size 0 / proxy_buffering off, which large image pushes need).
# externalURL, admin password, DB password and secretKey are injected from
# Terraform in harbor.tf.

expose:
  type: clusterIP
  tls:
    enabled: false

# Recreate applies to the registry + jobservice Deployments only (the two with
# shared PVCs) — avoids two writers on one NFS dir mid-upgrade. StatefulSets
# (db/redis/trivy) already replace pods in-place.
updateStrategy:
  type: Recreate

persistence:
  enabled: true
  persistentVolumeClaim:
    registry:
      storageClass: nfs-client
      size: 200Gi
    jobservice:
      jobLog:
        storageClass: nfs-client
        size: 1Gi
    database:
      storageClass: nfs-client
      size: 5Gi
    redis:
      storageClass: nfs-client
      size: 1Gi
    trivy:
      storageClass: nfs-client
      size: 5Gi

# Scrape via the kube-prometheus-stack operator (selectors are
# nil-uses-helm-values: false, so this ServiceMonitor is picked up as-is).
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

# goharbor images are amd64-only (no multi-arch manifests) — pods scheduled on
# the arm64 worker (bb-worker-02) die with `exec format error`. Pin every
# component to amd64 nodes. Drop these if goharbor ever ships multi-arch.
trivy:
  enabled: true
  nodeSelector: {kubernetes.io/arch: amd64}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

core:
  nodeSelector: {kubernetes.io/arch: amd64}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}

jobservice:
  nodeSelector: {kubernetes.io/arch: amd64}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}

# Registry pod has two containers, each with its own resources key — a flat
# registry.resources is silently ignored by the chart.
registry:
  nodeSelector: {kubernetes.io/arch: amd64}
  registry:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  controller:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}

portal:
  nodeSelector: {kubernetes.io/arch: amd64}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

nginx:
  nodeSelector: {kubernetes.io/arch: amd64}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}

exporter:
  nodeSelector: {kubernetes.io/arch: amd64}

database:
  # Chart defaults 900 core→db conns against the entrypoint's max_connections —
  # way past what a homelab needs and a memory blowup under scan/GC bursts.
  maxOpenConns: 100
  internal:
    nodeSelector: {kubernetes.io/arch: amd64}
    # /dev/shm is a memory-backed emptyDir counted against this container's
    # limit — keep it small so postgres work memory gets the headroom.
    shmSizeLimit: 128Mi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}

redis:
  internal:
    nodeSelector: {kubernetes.io/arch: amd64}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
