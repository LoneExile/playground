# kube-prometheus-stack — packaged form of prometheus-operator/kube-prometheus:
# Prometheus Operator + Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics + default dashboards/alerts.
# Chart: https://prometheus-community.github.io/helm-charts
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring -f kube-prometheus-stack.yaml
#
# Talos notes:
#   - kube-scheduler / kube-controller-manager are scraped: stage 01 sets
#     bind-address 0.0.0.0 on both (stock Talos binds them to 127.0.0.1 — if
#     that override is ever dropped, disable these scrapes + their rules).
#   - kube-proxy doesn't exist (Cilium kubeProxyReplacement: true).
#   - etcd has no metrics listener at all on Talos (metrics only via mTLS on
#     the client port). To scrape it later, add machine-config
#     cluster.etcd.extraArgs listen-metrics-urls: http://0.0.0.0:2381.
#   - node-exporter needs hostNetwork/hostPID/hostPath → runs in the
#     'monitoring' namespace, which already carries privileged PSA labels
#     (namespace is owned by manifests/node-thermal.yaml).

# --- Scrape targets not reachable on this cluster ---
kubeProxy:
  enabled: false # replaced by Cilium
kubeEtcd:
  enabled: false # no metrics listener on Talos; see header note to enable

defaultRules:
  create: true
  rules:
    etcd: false
    kubeProxy: false

# --- Prometheus ---
prometheus:
  prometheusSpec:
    retention: 90d
    retentionSize: 90GB
    # Pick up ServiceMonitors/PodMonitors/Rules from ALL namespaces, not just
    # ones labeled with this Helm release — lets app manifests ship their own
    # ServiceMonitor without extra labels.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # TSDB on NFS is officially discouraged (works in practice on this
    # ZFS-backed NFSv4.1 export; single writer, nolock is fine for the local
    # flock Prometheus takes). Keep retentionSize under the PVC size.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 100Gi}
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 3Gi}

# --- Alertmanager ---
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}

# --- Grafana ---
grafana:
  # adminPassword injected via set_sensitive, server.root_url via set — both in
  # monitoring.tf (root_url derives from local.hostnames.grafana).
  # OIDC client secret injected as an env var from the grafana-oidc Secret
  # (created in monitoring.tf); grafana.ini reads it via $__env{} below. The
  # subchart's assertNoLeakedSecrets guard forbids a literal secret in grafana.ini.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
  grafana.ini:
    security:
      cookie_secure: true # TLS-terminated at the gateway; never send cookies over http
      disable_gravatar: true
    analytics:
      check_for_updates: false
      reporting_enabled: false
    # OIDC SSO via Keycloak (homelab realm). client_secret injected via
    # set_sensitive in monitoring.tf (Keycloak-generated, never committed here).
    # "Lock to me": allow_sign_up=false → only an EXISTING Grafana user whose
    # email matches the Keycloak-asserted email can sign in via OIDC (set the
    # admin account's email to your Keycloak email, or pre-create a matching
    # user). Server-admin is granted only to holders of the `homelab-admin`
    # realm role; everyone else lands as Viewer.
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: false
      auto_login: false
      use_pkce: true
      use_refresh_token: true
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid email profile offline_access roles
      email_attribute_path: email
      login_attribute_path: username
      auth_url: https://keycloak.0dl.me/realms/homelab/protocol/openid-connect/auth
      token_url: https://keycloak.0dl.me/realms/homelab/protocol/openid-connect/token
      api_url: https://keycloak.0dl.me/realms/homelab/protocol/openid-connect/userinfo
      role_attribute_path: "contains(realm_access.roles[*], 'homelab-admin') && 'GrafanaAdmin' || 'Viewer'"
      role_attribute_strict: false
      allow_assign_grafana_admin: true
  persistence:
    enabled: true
    storageClassName: nfs-client
    size: 2Gi
  # sqlite on NFS — concurrent writers corrupt the DB, so never roll two pods
  deploymentStrategy:
    type: Recreate
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# --- node-exporter ---
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 128Mi}

# --- kube-state-metrics ---
kube-state-metrics:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
