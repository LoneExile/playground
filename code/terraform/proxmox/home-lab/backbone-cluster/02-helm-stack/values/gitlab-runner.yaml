# GitLab Runner — kubernetes executor: each CI job runs as a pod in the
# gitlab-runner namespace, scales to zero when idle.
# Chart: https://charts.gitlab.io
#
# Talks to GitLab over the in-cluster Service (plain HTTP) — skips the
# gateway/TLS hop entirely; clone_url keeps job checkouts on the same path.
# Runner auth token is injected from Terraform (runner.tf).

gitlabUrl: http://gitlab.gitlab.svc.cluster.local

# Never unregister on pod stop — with glrt auth tokens that DELETES the runner
# record in GitLab, so every config roll would brick the runner (403 on the
# next pod's verify) until a new token is minted.
unregisterRunners: false

concurrent: 4
checkInterval: 15

rbac:
  create: true

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}

runners:
  config: |
    [[runners]]
      url = "http://gitlab.gitlab.svc.cluster.local"
      clone_url = "http://gitlab.gitlab.svc.cluster.local"
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "alpine:3.21"
        cpu_request = "100m"
        memory_request = "128Mi"
        memory_limit = "2Gi"
      # Helper image tag is arch-specific (x86_64-vX.Y.Z, taken from the
      # manager's arch) — a job pod scheduled on the arm64 worker can't pull
      # it. Pin CI jobs to amd64 nodes.
      [runners.kubernetes.node_selector]
        "kubernetes.io/arch" = "amd64"
      # Rootless BuildKit (moby/buildkit:*-rootless) builds images without a
      # docker daemon. It runs as uid 1000 and clones a *user namespace*. Two
      # node/cluster prerequisites make that possible without privileged:
      #   1. user.max_user_namespaces > 0 (Talos zeroes it — set via the stage-01
      #      machine-config sysctl).
      #   2. seccomp Unconfined on the build container — the containerd default
      #      profile blocks clone(CLONE_NEWUSER) without CAP_SYS_ADMIN. An UNSET
      #      profile does NOT resolve to unconfined here (containerd applies its
      #      default), so we set Unconfined explicitly. Baseline PSA rejects that,
      #      hence the gitlab-runner namespace is labelled privileged (runner.tf).
      # Combined with --oci-worker-no-process-sandbox in the job, no privileged /
      # no CAP_SYS_ADMIN / no /proc unmasking is required.
      [runners.kubernetes.pod_security_context]
        fs_group = 1000
      [runners.kubernetes.build_container_security_context]
        run_as_user = 1000
        run_as_group = 1000
        [runners.kubernetes.build_container_security_context.seccomp_profile]
          type = "Unconfined"
