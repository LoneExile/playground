# codecentric keycloakx chart values (Keycloak 26.6.3, Quarkus).
# DB (Postgres) + secret come from manifests/keycloak-db.yaml; this chart only
# runs Keycloak and points at that Postgres. Fronted by our own Gateway API
# HTTPRoutes (keycloak.tf), so the chart Ingress stays off.

# Deterministic names → Service "keycloak-http" (targeted by the HTTPRoutes).
fullnameOverride: keycloak

# image.tag intentionally unset — defaults to the chart appVersion (Keycloak
# 26.6.2 for chart 7.2.0), so image and chart always match.

# The keycloakx chart does NOT inject a start command (command/args default to
# []), so the container would just print kc.sh usage and exit. Provide it here.
# Production 'start'; --http-enabled because TLS terminates at the edge. All
# other config (DB, proxy mode, hostname, relativePath) is passed as KC_* env
# vars the chart derives from the values/extraEnv below.
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"
  - "--http-enabled=true"

# Behind the backbone-gateway (Envoy) on LAN and Cloudflare Tunnel on public —
# both forward via the X-Forwarded-* family, so 'xforwarded' (not the RFC
# 'forwarded' header) is correct. http.enabled lets Keycloak serve plain HTTP
# since TLS terminates at the edge.
proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: true

# Serve at the root (modern Keycloak), not the legacy /auth prefix.
http:
  relativePath: "/"

# Accept requests on any Host so both keycloak.home.0dl.me (LAN) and
# keycloak.0dl.me (public) work; Keycloak builds absolute URLs from the
# forwarded headers. Bootstrap admin is seeded from the shared secret.
extraEnv: |
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: "admin"
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak
        key: admin-password
  - name: JAVA_OPTS_APPEND
    value: "-Djgroups.dns.query=keycloak-headless"

# Wait for Postgres before starting.
dbchecker:
  enabled: true

# External Postgres (manifests/keycloak-db.yaml). Password read from the
# 'keycloak' secret's .password key.
database:
  vendor: postgres
  hostname: postgres
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak

# Our own HTTPRoutes handle ingress (keycloak.tf).
ingress:
  enabled: false

# Prometheus scrape can be wired later (serviceMonitor.enabled); off for now.
metrics:
  enabled: false

# Mount the custom "homelab" login theme (ConfigMap keycloak-theme-homelab,
# created in keycloak-theme.tf) into the themes dir. subPath per-file so we only
# add these files under themes/homelab/login without clobbering the dir. The webp
# lands in the theme's resources/ subdir, where Keycloak serves it at
# ${url.resourcesPath}/homelab-bg.webp (login.ftl background).
extraVolumes: |
  - name: theme-homelab
    configMap:
      name: keycloak-theme-homelab
extraVolumeMounts: |
  - name: theme-homelab
    mountPath: /opt/keycloak/themes/homelab/login/theme.properties
    subPath: theme.properties
  - name: theme-homelab
    mountPath: /opt/keycloak/themes/homelab/login/login.ftl
    subPath: login.ftl
  - name: theme-homelab
    mountPath: /opt/keycloak/themes/homelab/login/resources/homelab-bg.webp
    subPath: homelab-bg.webp

service:
  httpPort: 80

resources:
  requests: {cpu: 200m, memory: 512Mi}
  limits:   {memory: 1280Mi}
