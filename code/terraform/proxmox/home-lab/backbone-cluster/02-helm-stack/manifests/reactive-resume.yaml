# Reactive Resume (https://github.com/AmruthPillai/Reactive-Resume) — self-hosted
# resume builder. v5.1.9 stack (Hono rewrite + Better Auth). v5 is NOT compatible
# with v4 data, and upstream ships no bulk v4->v5 migration; this instance was
# provisioned FRESH (old v4 data discarded on purpose). Four services:
#
#   app      amruthpillai/reactive-resume:v5.1.9  :3000  (stateless; Hono + client-side PDF)
#   postgres postgres:16                          :5432  data on NFS (fresh db-v5 subtree)
#   redis    redis:7-alpine                       :6379  ephemeral (agent stream cache; no NFS)
#   minio    minio/minio:latest                   :9000  S3 object store on NFS
#
# vs the old v4 stack: the browserless/chromium printer is GONE (v5 renders PDFs
# client-side via @react-pdf/renderer), and Redis is a NEW dependency.
#
# NFS layout (192.168.1.179:/zpool1/nfs_share) — one-PV-at-root + subPath pattern:
#   config/reactive-resume/db-v5 → /var/lib/postgresql/data on postgres (999:999, fresh v5 DB)
#   config/reactive-resume/minio → /data                    on minio    (1000:1000)
# The old config/reactive-resume/db (v4 PGDATA) is intentionally left untouched on
# the NAS so a git-revert to the v4 manifest still finds its data for rollback.
# Redis holds only disposable agent-stream cache, so it uses an emptyDir (no NFS).
#
# Exposure (unchanged from v4):
#   App   https://resume.home.0dl.me         (LAN, wildcard cert)
#         https://resume.0dl.me              (Cloudflare Tunnel)  <- APP_URL
#   Minio https://resume-storage.home.0dl.me (LAN, wildcard cert)
#         https://resume-storage.0dl.me      (Cloudflare Tunnel)
# APP_URL MUST equal the external HTTPS origin (Better Auth derives callback/JWKS
# URLs from it); a mismatch shows up as a login loop. The bucket-init Job sets an
# anonymous-download policy on the v5 bucket so publicly-shared resume assets load.
#
# Rendered via templatefile() in apps.tf. The $${reactive_resume_*} placeholders
# come from sensitive vars in 02-helm-stack/variables.tf <- terraform.tfvars.
#
# DEPLOY STEPS:
#   1. Secrets already in ../terraform.tfvars: reactive_resume_{db_password,
#      auth_secret,encryption_secret,storage_secret_key}.
#   2. terraform apply (from 02-helm-stack/). v4 pods are replaced; brief downtime.
#   3. Cloudflare tunnel routes for resume.0dl.me / resume-storage.0dl.me are
#      already published (carried over from v4) — no CF change needed.
#   4. Watch rollout:
#        kubectl -n reactive-resume get pods,jobs -w
#        kubectl -n reactive-resume logs -f deploy/app     # runs Drizzle migrations on boot
#   5. Open https://resume.home.0dl.me and register your account (signups open).
#   6. FOLLOW-UP — lock down signups: set FLAG_DISABLE_SIGNUPS: "true" on deploy/app
#      below and re-apply.

apiVersion: v1
kind: Namespace
metadata:
  name: reactive-resume
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Static PV — bind explicitly, no provisioner. Same one-PV-at-NAS-root pattern
# as immich/paperless; deployments use subPath to scope to their subtree.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reactive-resume-nas
spec:
  capacity: {storage: 1Ti}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, nolock, noatime]
  nfs:
    server: 192.168.1.179
    path: /zpool1/nfs_share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reactive-resume-nas
  namespace: reactive-resume
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: reactive-resume-nas
  resources:
    requests: {storage: 1Ti}
---
# Secret — values rendered by templatefile() at terraform apply time.
# database-url embeds the password so the app reads a single DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: reactive-resume-secrets
  namespace: reactive-resume
type: Opaque
stringData:
  postgres-password: "${reactive_resume_db_password}"
  database-url: "postgresql://reactive_resume:${reactive_resume_db_password}@postgres:5432/reactive_resume"
  auth-secret: "${reactive_resume_auth_secret}"
  encryption-secret: "${reactive_resume_encryption_secret}"
  storage-secret-key: "${reactive_resume_storage_secret_key}"
  # Keycloak-generated `reactive-resume` client secret (Better Auth genericOAuth).
  oauth-client-secret: "${reactive_resume_oidc_client_secret}"
---
# Postgres 16 (debian) — FRESH v5 PGDATA on NFS at config/reactive-resume/db-v5.
# Uses uid 999 like the proven immich PG-on-this-NFS setup. initContainer chowns +
# chmod 700 because k8s auto-creates the subPath root-owned and initdb refuses a
# non-700 PGDATA. On first boot initdb creates the 'reactive_resume' role + db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: reactive-resume
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      initContainers:
        - name: pgdata-prep
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              chown 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
              # Self-heal: an unclean shutdown (Pi power loss / NFS hiccup) can
              # leave an empty/corrupt postmaster.pid behind. Postgres then
              # refuses to start ("lock file postmaster.pid is empty") and
              # crashloops. Safe to delete here: replicas:1 + Recreate means no
              # live postmaster can be holding it when this initContainer runs.
              pid=/var/lib/postgresql/data/postmaster.pid
              if [ -f "$pid" ] && [ ! -s "$pid" ]; then
                echo "removing stale empty postmaster.pid"
                rm -f "$pid"
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: nas, mountPath: /var/lib/postgresql/data, subPath: config/reactive-resume/db-v5}
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: reactive_resume}
            - {name: POSTGRES_DB,   value: reactive_resume}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: postgres-password}
            - {name: POSTGRES_INITDB_ARGS, value: "--data-checksums"}
            - {name: PGDATA, value: /var/lib/postgresql/data}
          volumeMounts:
            - {name: nas,  mountPath: /var/lib/postgresql/data, subPath: config/reactive-resume/db-v5}
            - {name: dshm, mountPath: /dev/shm}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          startupProbe:
            exec: {command: [pg_isready, -U, reactive_resume, -d, reactive_resume]}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 36   # up to ~6min for recovery on slow NFS
            timeoutSeconds: 10
          readinessProbe:
            exec: {command: [pg_isready, -U, reactive_resume, -d, reactive_resume]}
            initialDelaySeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, reactive_resume, -d, reactive_resume]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: reactive-resume-nas
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: reactive-resume
  labels: {app: postgres}
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# Minio — S3-compatible object store for uploaded avatars + exported PDFs.
# Runs as uid 1000; initContainer chowns the NFS subPath to match. MINIO_ROOT_USER
# must equal the app's S3_ACCESS_KEY_ID; password comes from the shared secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: reactive-resume
  labels: {app: minio}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      initContainers:
        - name: data-prep
          image: busybox:1.36
          command: [sh, -c, "chown 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: nas, mountPath: /data, subPath: config/reactive-resume/minio}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:latest
          args: [server, /data]
          ports:
            - {name: s3, containerPort: 9000}
          env:
            - {name: MINIO_ROOT_USER, value: reactive-resume}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: storage-secret-key}
          volumeMounts:
            - {name: nas, mountPath: /data, subPath: config/reactive-resume/minio}
          resources:
            requests: {cpu: 50m,  memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: reactive-resume-nas
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: reactive-resume
  labels: {app: minio}
spec:
  type: ClusterIP
  selector: {app: minio}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
# Redis — NEW in v5. Backs the authenticated /agent AI workspace (chat/stream
# cache). Data is disposable, so it runs in-memory on an emptyDir (no persistence,
# no NFS). ClusterIP only; protected-mode is disabled because the app connects by
# service name (non-loopback) with no password — safe since it's never exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reactive-resume
  labels: {app: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: [redis-server, --protected-mode, "no", --save, "", --appendonly, "no"]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits:   {cpu: 250m, memory: 256Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: reactive-resume
  labels: {app: redis}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
# App — Reactive Resume v5 server (Hono). Runs Drizzle migrations on boot against
# the fresh DB, so first start can take a minute; the startupProbe gives it
# headroom before liveness kicks in. Waits for postgres to accept connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: reactive-resume
  labels: {app: reactive-resume}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: reactive-resume}
  template:
    metadata:
      labels: {app: reactive-resume}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              set -eu
              for i in $(seq 1 120); do
                pg_isready -h postgres -U reactive_resume -d reactive_resume && exit 0
                sleep 2
              done
              echo "postgres never became ready" >&2
              exit 1
      containers:
        - name: app
          image: amruthpillai/reactive-resume:v5.1.9
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: TZ, value: "Asia/Bangkok"}
            - {name: NODE_ENV, value: "production"}
            - {name: PORT,        value: "3000"}   # public app (Hono web)
            - {name: SERVER_PORT, value: "3001"}   # internal API server (v5 runtime split)
            # Public origin — Better Auth derives callback/JWKS URLs from this.
            # MUST equal the external HTTPS origin or logins loop.
            - {name: APP_URL, value: "https://resume.0dl.me"}
            # Database (Drizzle) — full URL incl. password from the secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: database-url}
            # Better Auth — single signing secret (replaces v4 access+refresh).
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: auth-secret}
            # Encrypts saved AI-provider credentials.
            - name: ENCRYPTION_SECRET
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: encryption-secret}
            # Redis — agent workspace cache.
            - {name: REDIS_URL, value: "redis://redis:6379"}
            # Storage — S3-compatible (Minio). Path-style is required for Minio.
            - {name: S3_ENDPOINT,        value: "http://minio:9000"}
            - {name: S3_REGION,          value: "us-east-1"}
            - {name: S3_BUCKET,          value: "reactive-resume"}
            - {name: S3_ACCESS_KEY_ID,   value: "reactive-resume"}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: storage-secret-key}
            - {name: S3_FORCE_PATH_STYLE, value: "true"}
            # Email — no SMTP wired; the app logs verification emails to stdout.
            # Read them with: kubectl -n reactive-resume logs deploy/app
            # Signups locked — owner account (lex / me@apinant.dev) exists. Flip
            # back to "false" + re-apply only to register another account.
            - {name: FLAG_DISABLE_SIGNUPS, value: "true"}
            # OIDC SSO via Keycloak (homelab realm) — Better Auth genericOAuth
            # (providerId "custom", callback /api/auth/oauth2/callback/custom on
            # APP_URL). With signups disabled, SSO links to the existing owner
            # account by matching email — so Keycloak must assert me@apinant.dev.
            # To onboard a NEW SSO identity, flip FLAG_DISABLE_SIGNUPS to "false"
            # for one login, then re-lock. Only the public APP_URL host is trusted.
            - {name: OAUTH_PROVIDER_NAME, value: "Keycloak"}
            - {name: OAUTH_CLIENT_ID,     value: "reactive-resume"}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: oauth-client-secret}
            - {name: OAUTH_DISCOVERY_URL, value: "https://keycloak.0dl.me/realms/homelab/.well-known/openid-configuration"}
            - {name: OAUTH_SCOPES,        value: "openid profile email"}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60     # ~5 min cap on first-boot drizzle migration
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {cpu: "2",  memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: reactive-resume
  labels: {app: reactive-resume}
spec:
  type: ClusterIP
  selector: {app: reactive-resume}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
# LAN route — app, wildcard TLS at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: reactive-resume
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
  hostnames:
    - resume.home.0dl.me
  rules:
    - backendRefs:
        - name: app
          port: 3000
---
# Tunnel route — bare resume.0dl.me via Cloudflare Tunnel (CF terminates TLS;
# bind to the :http listener).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-tunnel
  namespace: reactive-resume
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - resume.0dl.me
  rules:
    - backendRefs:
        - name: app
          port: 3000
---
# LAN route — minio object store, wildcard TLS at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio
  namespace: reactive-resume
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
  hostnames:
    - resume-storage.home.0dl.me
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# Tunnel route — bare resume-storage.0dl.me via Cloudflare Tunnel. Serves the
# public asset URLs the app embeds (avatars, exported PDFs).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-tunnel
  namespace: reactive-resume
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - resume-storage.0dl.me
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# Bucket-init Job — v5 does not auto-create the S3 bucket, so seed it with mc.
# Waits for minio, creates the bucket idempotently, and sets an anonymous-download
# policy so publicly-shared resume assets resolve via resume-storage.0dl.me.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: reactive-resume
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: minio-bucket-init}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              set -eu
              until mc alias set rr http://minio:9000 "$MINIO_USER" "$MINIO_PASS" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing rr/reactive-resume
              mc anonymous set download rr/reactive-resume
              echo "bucket reactive-resume ready"
          env:
            - {name: MINIO_USER, value: "reactive-resume"}
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef: {name: reactive-resume-secrets, key: storage-secret-key}
