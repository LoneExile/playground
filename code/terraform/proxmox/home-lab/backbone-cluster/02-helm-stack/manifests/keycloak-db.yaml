# Keycloak's Postgres + secrets. Keycloak itself is the codecentric keycloakx
# Helm chart (keycloak.tf); this manifest provides what the chart needs but does
# not bundle: a dedicated Postgres with its data on NFS, and the shared secret.
#
# NFS layout (192.168.1.179:/zpool1/nfs_share) — one-PV-at-root + subPath, same
# pattern as reactive-resume/immich:
#   config/keycloak/db → /var/lib/postgresql/data on postgres (999:999)
#
# Secret `keycloak` (key `password`) is consumed by BOTH the postgres container
# (POSTGRES_PASSWORD) and the keycloakx chart (database.existingSecret → .password).
# `admin-password` seeds the Keycloak bootstrap admin (KC_BOOTSTRAP_ADMIN_PASSWORD).
# Values rendered by templatefile() in apps.tf from sensitive tfvars.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak
  namespace: keycloak
type: Opaque
stringData:
  password: "${keycloak_db_password}"
  admin-password: "${keycloak_admin_password}"
---
# Static PV at the NAS root; postgres subPaths into config/keycloak/db. Same
# one-PV-at-root pattern as the other NFS apps.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-nas
spec:
  capacity: {storage: 50Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, nolock, noatime]
  nfs:
    server: 192.168.1.179
    path: /zpool1/nfs_share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-nas
  namespace: keycloak
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: keycloak-nas
  resources:
    requests: {storage: 50Gi}
---
# Postgres 16 — PGDATA on NFS at config/keycloak/db. uid 999 like the proven
# immich/reactive-resume PG-on-this-NFS setup; initContainer chowns + chmod 700
# (k8s creates the subPath root-owned; initdb refuses a non-700 PGDATA) and
# clears a stale empty postmaster.pid left by an unclean shutdown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: keycloak
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      initContainers:
        - name: pgdata-prep
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              chown 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
              pid=/var/lib/postgresql/data/postmaster.pid
              if [ -f "$pid" ] && [ ! -s "$pid" ]; then
                echo "removing stale empty postmaster.pid"
                rm -f "$pid"
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: nas, mountPath: /var/lib/postgresql/data, subPath: config/keycloak/db}
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: keycloak}
            - {name: POSTGRES_DB,   value: keycloak}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak, key: password}
            - {name: POSTGRES_INITDB_ARGS, value: "--data-checksums"}
            - {name: PGDATA, value: /var/lib/postgresql/data}
          volumeMounts:
            - {name: nas,  mountPath: /var/lib/postgresql/data, subPath: config/keycloak/db}
            - {name: dshm, mountPath: /dev/shm}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          startupProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 36
            timeoutSeconds: 10
          readinessProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            initialDelaySeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: keycloak-nas
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keycloak
  labels: {app: postgres}
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
