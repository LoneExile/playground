# Jellyfin — media server.
# Reuses the old /config/jelly/{config,cache} on the NAS so library + metadata
# survive the cluster rebuild. Your 101 movies + 144 series mount in via
# /media/movies and /media/series.
#
# Differences vs the old Rockchip manifest:
#   - Image: official jellyfin/jellyfin:latest (amd64) instead of
#     nyanmisaka/jellyfin:latest-rockchip (Rockchip-only)
#   - Hardware transcoding: ENABLED (Intel Quick Sync / QSV). /dev/dri is
#     passed through from Proxmox to the intel-quicksync worker, and the
#     seed-qsv-encoding initContainer writes a QSV-enabled encoding.xml on
#     first run (from the jellyfin-encoding-seed ConfigMap below). Before this,
#     HardwareAccelerationType was "none" -> every transcode ran libx264 on
#     CPU, saturating the 4-core limit and causing playback buffering/freezes.
#   - No more /dev/{dma_heap,mali0,rga,mpp_service} — Rockchip-specific.
#   - Service: LoadBalancer (MetalLB) so it gets a 10.0.10.210–230 IP.
#
# Apply:
#   kubectl apply -f jellyfin.yaml
#   kubectl -n jellyfin get svc
# Wait ~30s for the server to start, then browse to http://<ExternalIP>:8096
# and complete the setup wizard (point the Movies library at /media/movies,
# Shows at /media/series).

apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  labels:
    # privileged required for hostPath mount of /dev/dri (VAAPI transcoding)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Seed config for Jellyfin's encoding.xml — enables Intel Quick Sync (QSV)
# hardware transcoding out of the box. The seed-qsv-encoding initContainer only
# writes this when /config/config/encoding.xml is ABSENT (fresh NAS / first
# deploy), so it never clobbers settings you later change in the admin UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-encoding-seed
  namespace: jellyfin
data:
  encoding.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <EncodingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
      <EncodingThreadCount>-1</EncodingThreadCount>
      <EnableFallbackFont>false</EnableFallbackFont>
      <EnableAudioVbr>false</EnableAudioVbr>
      <DownMixAudioBoost>2</DownMixAudioBoost>
      <DownMixStereoAlgorithm>None</DownMixStereoAlgorithm>
      <MaxMuxingQueueSize>2048</MaxMuxingQueueSize>
      <EnableThrottling>false</EnableThrottling>
      <ThrottleDelaySeconds>180</ThrottleDelaySeconds>
      <!-- Prune played HLS segments during playback so /cache stays bounded.
           With this false, transcode segments accumulated until the cache
           emptyDir hit its sizeLimit and the pod was EVICTED mid-stream. -->
      <EnableSegmentDeletion>true</EnableSegmentDeletion>
      <SegmentKeepSeconds>720</SegmentKeepSeconds>
      <HardwareAccelerationType>qsv</HardwareAccelerationType>
      <EncoderAppPathDisplay>/usr/lib/jellyfin-ffmpeg/ffmpeg</EncoderAppPathDisplay>
      <VaapiDevice>/dev/dri/renderD128</VaapiDevice>
      <QsvDevice>/dev/dri/renderD128</QsvDevice>
      <EnableTonemapping>false</EnableTonemapping>
      <EnableVppTonemapping>true</EnableVppTonemapping>
      <EnableVideoToolboxTonemapping>false</EnableVideoToolboxTonemapping>
      <TonemappingAlgorithm>bt2390</TonemappingAlgorithm>
      <TonemappingMode>auto</TonemappingMode>
      <TonemappingRange>auto</TonemappingRange>
      <TonemappingDesat>0</TonemappingDesat>
      <TonemappingPeak>100</TonemappingPeak>
      <TonemappingParam>0</TonemappingParam>
      <VppTonemappingBrightness>16</VppTonemappingBrightness>
      <VppTonemappingContrast>1</VppTonemappingContrast>
      <H264Crf>23</H264Crf>
      <H265Crf>28</H265Crf>
      <EncoderPreset xsi:nil="true" />
      <DeinterlaceDoubleRate>false</DeinterlaceDoubleRate>
      <DeinterlaceMethod>yadif</DeinterlaceMethod>
      <EnableDecodingColorDepth10Hevc>true</EnableDecodingColorDepth10Hevc>
      <EnableDecodingColorDepth10Vp9>true</EnableDecodingColorDepth10Vp9>
      <EnableDecodingColorDepth10HevcRext>false</EnableDecodingColorDepth10HevcRext>
      <EnableDecodingColorDepth12HevcRext>false</EnableDecodingColorDepth12HevcRext>
      <EnableEnhancedNvdecDecoder>true</EnableEnhancedNvdecDecoder>
      <PreferSystemNativeHwDecoder>true</PreferSystemNativeHwDecoder>
      <EnableIntelLowPowerH264HwEncoder>false</EnableIntelLowPowerH264HwEncoder>
      <EnableIntelLowPowerHevcHwEncoder>false</EnableIntelLowPowerHevcHwEncoder>
      <EnableHardwareEncoding>true</EnableHardwareEncoding>
      <AllowHevcEncoding>true</AllowHevcEncoding>
      <AllowAv1Encoding>false</AllowAv1Encoding>
      <EnableSubtitleExtraction>true</EnableSubtitleExtraction>
      <HardwareDecodingCodecs>
        <string>hevc</string>
        <string>vp9</string>
        <string>av1</string>
        <string>mpeg2video</string>
        <string>h264</string>
        <string>vc1</string>
      </HardwareDecodingCodecs>
      <AllowOnDemandMetadataBasedKeyframeExtractionForExtensions>
        <string>mkv</string>
      </AllowOnDemandMetadataBasedKeyframeExtractionForExtensions>
    </EncodingOptions>
---
# Static PV pointing at the same NFS share root — separate PV from
# filebrowser's so each namespace gets its own PVC binding.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-nas
spec:
  capacity: {storage: 15Ti}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - nolock
    - noatime
  nfs:
    server: 192.168.1.179
    path: /zpool1/nfs_share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-nas
  namespace: jellyfin
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: jellyfin-nas
  resources:
    requests: {storage: 15Ti}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels: {app: jellyfin}
spec:
  replicas: 1
  strategy: {type: Recreate}    # RWX file locks on sqlite DBs dislike rolling
  selector:
    matchLabels: {app: jellyfin}
  template:
    metadata:
      labels: {app: jellyfin}
    spec:
      # Pin to the NAS-hosted worker that has Intel iGPU passthrough.
      nodeSelector:
        accelerator: intel-quicksync
      initContainers:
        # Seed a QSV-enabled encoding.xml on first run so Intel Quick Sync
        # hardware transcoding works out of the box. No-op when the file already
        # exists (it's NFS-persistent), so admin-UI changes are never clobbered.
        - name: seed-qsv-encoding
          image: jellyfin/jellyfin:10.11.11
          command:
            - sh
            - -c
            - >-
              if [ -f /config/config/encoding.xml ]; then
              echo "encoding.xml present — leaving as-is";
              else
              mkdir -p /config/config &&
              cp /seed/encoding.xml /config/config/encoding.xml &&
              echo "seeded QSV encoding.xml";
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: nas, mountPath: /config, subPath: config/jelly/config}
            - {name: encoding-seed, mountPath: /seed}
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          ports:
            - {name: http, containerPort: 8096}
          env:
            - {name: TZ, value: Asia/Bangkok}
            - {name: JELLYFIN_PublishedServerUrl, value: "https://jellyfin.home.0dl.me"}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # privileged is required for the container to open /dev/dri/*
            # (kubelet's default device cgroup denies DRM char devices otherwise).
            privileged: true
          resources:
            requests: {cpu: "1000m", memory: "2Gi"}
            limits:   {cpu: "4000m", memory: "8Gi"}
          volumeMounts:
            - {name: nas, mountPath: /config, subPath: config/jelly/config}
            # /cache is transcode scratch + image cache — ephemeral by nature,
            # rebuilds on restart. Keeping it on NFS was causing heavy writes to
            # stall kubelet/containerd when the NAS was busy. emptyDir sits on
            # worker's local disk (LVM thin on SSD-01) — much faster, NFS stays quiet.
            - {name: cache, mountPath: /cache}
            - {name: nas, mountPath: /media/movies, subPath: home/movie}
            - {name: nas, mountPath: /media/series, subPath: home/series}
            # Intel Quick Sync (QSV) — pre-enabled via the jellyfin-encoding-seed
            # ConfigMap (HardwareAccelerationType=qsv, device /dev/dri/renderD128).
            # Re-tune in Jellyfin admin → Dashboard → Playback → Transcoding.
            - {name: dri, mountPath: /dev/dri}
          startupProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 5
            failureThreshold: 60      # up to 5 minutes cold start
          readinessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 10
            timeoutSeconds: 5         # default 1s times out under trickplay/transcode load
            failureThreshold: 5       # don't yank from Service on a brief spike
          livenessProbe:
            httpGet: {path: /health, port: 8096}
            periodSeconds: 30
            timeoutSeconds: 5         # default 1s times out under load -> false restart
            failureThreshold: 5       # ~2.5min unhealthy before kill; survives load spikes
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: jellyfin-nas
        # QSV encoding.xml seed (consumed by the seed-qsv-encoding initContainer).
        - name: encoding-seed
          configMap:
            name: jellyfin-encoding-seed
        # Ephemeral cache — transcode scratch + image cache. sizeLimit is a hard
        # eviction trigger: if usage exceeds it, kubelet evicts the pod. Paired
        # with EnableSegmentDeletion=true (above) which keeps usage bounded; 20Gi
        # gives headroom for several concurrent transcodes.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        # legacy placeholder (kept for grep-parity with old manifest)
        #   hostPath: {path: /dev/dri}
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  labels: {app: jellyfin}
spec:
  # Routed via backbone-gateway — https://jellyfin.home.0dl.me
  type: ClusterIP
  selector: {app: jellyfin}
  ports:
    - {name: http, port: 8096, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
  hostnames:
    - jellyfin.home.0dl.me
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
---
# Tunnel route — bare jellyfin.0dl.me via Cloudflare Tunnel. HTTP-only (the
# wildcard cert covers *.home.0dl.me, not this hostname), so bind explicitly
# to the :80 listener. CF terminates TLS at the edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-tunnel
  namespace: jellyfin
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - jellyfin.0dl.me
  rules:
    - backendRefs:
        - name: jellyfin
          port: 8096
