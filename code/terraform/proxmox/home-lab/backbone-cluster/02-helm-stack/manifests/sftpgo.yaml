# SFTPGo — multi-protocol file server (web client/admin + SFTP), replacing
# filebrowser. Serves the NFS share ROOT at /srv (same as filebrowser did).
#
# Rendered by templatefile() in apps.tf (needs the OIDC client secret + the
# bootstrap password from sensitive tfvars). Data provider is sqlite on the NFS
# hidden subPath config/sftpgo/state — embedded-DB-on-this-NFS is the same proven
# pattern filebrowser uses (Recreate strategy avoids lock contention on rollout).
#
# Exposure:
#   https://sftpgo.home.0dl.me   LAN, wildcard TLS at the gateway   → web UI
#   https://sftpgo.0dl.me        public via Cloudflare Tunnel        → web UI
#   sftp://<MetalLB LAN IP>:2022  LAN only (LoadBalancer)            → SFTP
#
# Auth: Keycloak OIDC (homelab realm, client "sftpgo"). implicit_roles=true maps
# the login link (WebAdmin vs WebClient) to the SFTPGo role; the ID token's
# preferred_username must match an existing SFTPGo admin/user — bootstrapped
# below as "loneexile" (the GitHub-brokered Keycloak username). Local
# admin/user passwords are break-glass fallback; OIDC is the primary login.

apiVersion: v1
kind: Namespace
metadata:
  name: sftpgo
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: sftpgo
  namespace: sftpgo
type: Opaque
stringData:
  oidc-client-secret: "${sftpgo_oidc_client_secret}"
  # Declarative bootstrap (SFTPGO_LOADDATA_MODE=0 → add+update, re-applied every
  # start so this file is the source of truth; UI edits to these objects are
  # reverted on restart). One admin + one user named to match the Keycloak
  # preferred_username so OIDC resolves them. The user's home is the NAS root
  # (browse the whole share like filebrowser), plus a RustFS S3 bucket mounted
  # as a virtual folder at /s3-home.
  loaddata.json: |
    {
      "admins": [
        {
          "username": "loneexile",
          "password": "${sftpgo_bootstrap_password}",
          "status": 1,
          "permissions": ["*"],
          "description": "Bootstrap admin; Keycloak OIDC is the primary login."
        }
      ],
      "folders": [
        {
          "name": "s3-rustfs",
          "mapped_path": "/var/lib/sftpgo/vfolders/s3-rustfs",
          "description": "RustFS S3 bucket 'sftpgo' (10.0.10.199:9000)",
          "filesystem": {
            "provider": 1,
            "s3config": {
              "bucket": "sftpgo",
              "region": "us-east-1",
              "endpoint": "http://10.0.10.199:9000",
              "force_path_style": true,
              "access_key": "${sftpgo_s3_access_key}",
              "access_secret": { "status": "Plain", "payload": "${sftpgo_s3_secret_key}" }
            }
          }
        }
      ],
      "users": [
        {
          "username": "loneexile",
          "password": "${sftpgo_bootstrap_password}",
          "status": 1,
          "home_dir": "/srv",
          "permissions": { "/": ["*"] },
          "description": "Bootstrap user, home=NAS root; Keycloak OIDC primary login.",
          "virtual_folders": [
            {
              "name": "s3-rustfs",
              "virtual_path": "/s3-home",
              "quota_size": -1,
              "quota_files": -1
            }
          ]
        }
      ]
    }
---
# Static PV at the NAS root (bypasses the dynamic provisioner so we reach the
# share root), same as filebrowser's nas-root.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sftpgo-nas-root
  labels:
    share: sftpgo-nas-root
spec:
  capacity: {storage: 15Ti}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, nolock, noatime]
  nfs:
    server: 192.168.1.179
    path: /zpool1/nfs_share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-nas-root
  namespace: sftpgo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sftpgo-nas-root
  resources:
    requests: {storage: 15Ti}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftpgo
  namespace: sftpgo
  labels: {app: sftpgo}
spec:
  replicas: 1
  # sqlite on the NFS subPath is single-writer; Recreate kills the old pod before
  # the new one starts so they don't fight over the DB (same as filebrowser).
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sftpgo}
  template:
    metadata:
      labels: {app: sftpgo}
    spec:
      # Run as root for full read/write to the NAS share (parity with the
      # filebrowser setup it replaces).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: sftpgo
          image: drakkan/sftpgo:v2.7.4-alpine
          ports:
            - {name: http, containerPort: 8080}
            - {name: sftp, containerPort: 2022}
          env:
            # State (sqlite DB + generated SSH host keys) on the NFS subPath.
            - {name: SFTPGO_CONFIG_DIR, value: /var/lib/sftpgo}
            - {name: SFTPGO_DATA_PROVIDER__DRIVER, value: sqlite}
            - {name: SFTPGO_DATA_PROVIDER__NAME, value: /var/lib/sftpgo/sftpgo.db}
            # Bootstrap admin/user from the mounted Secret (add-only).
            - {name: SFTPGO_LOADDATA_FROM, value: /etc/sftpgo-init/loaddata.json}
            # 0 = add+update: this file is the source of truth, re-applied each
            # start (needed so the S3 virtual folder lands on the existing user).
            - {name: SFTPGO_LOADDATA_MODE, value: "0"}
            # HTTP binding (web admin + web client) — fronted by the gateway.
            - {name: SFTPGO_HTTPD__BINDINGS__0__PORT, value: "8080"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN, value: "true"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT, value: "true"}
            # OIDC (Keycloak homelab realm).
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CONFIG_URL, value: "https://keycloak.0dl.me/realms/homelab"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_ID, value: "sftpgo"}
            - name: SFTPGO_HTTPD__BINDINGS__0__OIDC__CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: sftpgo, key: oidc-client-secret}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__REDIRECT_BASE_URL, value: "https://${sftpgo_tunnel_host}"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__USERNAME_FIELD, value: "preferred_username"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__IMPLICIT_ROLES, value: "true"}
            - {name: SFTPGO_HTTPD__BINDINGS__0__OIDC__SCOPES, value: "openid,profile,email"}
            # SFTP binding on 2022 (exposed on the LAN via the LoadBalancer svc).
            - {name: SFTPGO_SFTPD__BINDINGS__0__PORT, value: "2022"}
            # WebDAV off for now (enable a binding + route later if wanted).
            - {name: SFTPGO_WEBDAVD__BINDINGS__0__PORT, value: "0"}
          volumeMounts:
            - {name: nas, mountPath: /var/lib/sftpgo, subPath: config/sftpgo/state}
            - {name: nas, mountPath: /srv}
            - {name: init, mountPath: /etc/sftpgo-init, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: "1", memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: sftpgo-nas-root
        - name: init
          secret:
            secretName: sftpgo
            items:
              - {key: loaddata.json, path: loaddata.json}
---
# HTTP service (web UI) — routed via backbone-gateway.
apiVersion: v1
kind: Service
metadata:
  name: sftpgo
  namespace: sftpgo
  labels: {app: sftpgo}
spec:
  type: ClusterIP
  selector: {app: sftpgo}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# SFTP service — MetalLB LoadBalancer, LAN only (SFTP is SSH/L4, can't go through
# the L7 HTTP gateway). Auto-assigned IP from the MetalLB pool.
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-sftp
  namespace: sftpgo
  labels: {app: sftpgo}
spec:
  type: LoadBalancer
  selector: {app: sftpgo}
  ports:
    - {name: sftp, port: 2022, targetPort: sftp}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo
  namespace: sftpgo
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - ${sftpgo_host}
  rules:
    - backendRefs:
        - name: sftpgo
          port: 80
---
# Tunnel route — bare sftpgo.0dl.me via Cloudflare Tunnel. CF terminates TLS and
# forwards http to the gateway's :80 listener, which stamps X-Forwarded-Proto:
# http; force it back to https so SFTPGo issues https cookies/links over the
# tunnel (same fix as keycloak). Needs the matching public-hostname entry on the
# tunnel in the CF Zero Trust dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sftpgo-tunnel
  namespace: sftpgo
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ${sftpgo_tunnel_host}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Proto, value: https}
      backendRefs:
        - name: sftpgo
          port: 80
