# GitLab CE — omnibus all-in-one container (not the cloud-native chart: that's
# 10+ microservice pods and needs ~8Gi; omnibus idles ~3Gi with bundled
# monitoring off, which fits this cluster).
#
# TLS terminates at backbone-gateway; omnibus nginx listens plain :80
# (external_url is https:// so generated links are correct). SSH is raw TCP so
# it can't ride the HTTP gateway — dedicated MetalLB LoadBalancer on
# 10.0.10.213, reachable as gitlab-ssh.home.0dl.me (A record in gateway.tf).
#
# Gitaly on NFS is officially unsupported by GitLab (slow packfile IO, relies
# on POSIX locking) — accepted here like every other stateful app on this
# cluster; single replica only, Recreate strategy.
#
# GITLAB_ROOT_PASSWORD seeds the root account on FIRST boot only.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
  labels:
    # omnibus init runs as root (chef reconfigures /etc,/var/opt) — baseline
    # PSA allows root without privileged, same as memos.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs
  namespace: gitlab
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests: {storage: 100Gi}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-secrets
  namespace: gitlab
type: Opaque
data:
  # base64encode()d in apps.tf — keeps any future password charset YAML-safe
  root-password: "${gitlab_root_password_b64}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels: {app: gitlab}
spec:
  replicas: 1
  strategy: {type: Recreate}    # single gitaly/postgres writer on NFS
  selector:
    matchLabels: {app: gitlab}
  template:
    metadata:
      labels: {app: gitlab}
    spec:
      # Only node with headroom for the ~4.5Gi working set (15.9Gi, ~8.5Gi
      # requestable free); ctrl nodes and the arm64 worker sit at 7Gi total.
      # Same pinning precedent as jellyfin.
      nodeSelector:
        kubernetes.io/hostname: bb-worker-01
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:19.1.1-ce.0
          ports:
            - {name: http, containerPort: 80}
            - {name: ssh, containerPort: 22}
          env:
            - {name: TZ, value: Asia/Bangkok}
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: gitlab-secrets, key: root-password}
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://gitlab.home.0dl.me'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                gitlab_rails['gitlab_ssh_host'] = 'gitlab-ssh.home.0dl.me'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
                gitlab_rails['time_zone'] = 'Asia/Bangkok'
                # NOTE: signup can't be disabled from omnibus config in 19.x
                # (the old gitlab_signup_enabled key is a silent no-op) — it's
                # a runtime setting, disabled post-boot via:
                #   gitlab-rails runner "ApplicationSetting.current.update!(signup_enabled: false)"
                # 'public' visibility unselectable instance-wide — this one IS
                # first-boot seeded from config
                gitlab_rails['gitlab_restricted_visibility_levels'] = ['public']
                # Trust the pod CIDR (Envoy gateway pods) so rails resolves the
                # real client from X-Forwarded-For — without this every request
                # appears to come from the gateway pod IP: audit logs are
                # useless, per-IP throttles would bucket the whole internet as
                # one client, and the monitoring endpoints below would be
                # reachable through the gateway from anywhere.
                # 10.0.10.166 = cloudflared host — trusted so tunnel visitors
                # resolve to their real public IP (and get 403 from the
                # monitoring endpoints below) instead of appearing as a LAN IP
                gitlab_rails['trusted_proxies'] = ['100.124.0.0/16', '10.0.10.166/32']
                nginx['real_ip_header'] = 'X-Forwarded-For'
                nginx['real_ip_trusted_addresses'] = ['100.124.0.0/16', '10.0.10.166/32']
                nginx['real_ip_recursive'] = 'on'
                # kubelet probes come from the node net / cilium_host pod-CIDR
                # IP; readiness endpoints are localhost-only by default
                gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '10.0.10.0/24', '100.124.0.0/16']
                # cluster already runs kube-prometheus-stack; bundled
                # prometheus + exporters cost ~600Mi
                prometheus_monitoring['enable'] = false
                # homelab-sized: omnibus defaults assume worker-per-core
                puma['worker_processes'] = 2
                sidekiq['concurrency'] = 10
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            # warm working set ~4-4.5Gi (puma 2 workers + sidekiq + postgres +
            # gitaly); request it honestly so the scheduler doesn't wedge this
            # next to etcd on a 7Gi control-plane node
            requests: {cpu: 500m, memory: 4Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/gitlab}
            - {name: logs, mountPath: /var/log/gitlab}
            - {name: data, mountPath: /var/opt/gitlab}
            - {name: shm, mountPath: /dev/shm}
          startupProbe:
            httpGet: {path: /-/health, port: 80}
            periodSeconds: 10
            failureThreshold: 180  # 30min — first boot on NFS runs initdb + the
                                   # full migration chain; killing it mid-initdb
                                   # crash-loops the seed
          readinessProbe:
            httpGet: {path: /-/readiness, port: 80}
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /-/health, port: 80}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: gitlab-config}
        - name: logs
          persistentVolumeClaim: {claimName: gitlab-logs}
        - name: data
          persistentVolumeClaim: {claimName: gitlab-data}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels: {app: gitlab}
spec:
  type: ClusterIP
  selector: {app: gitlab}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# git-over-SSH — raw TCP, can't ride the HTTP gateway. Dedicated MetalLB IP;
# gitlab-ssh.home.0dl.me A record (gateway.tf) points here, and
# gitlab_ssh_host above makes the UI show that hostname in clone URLs.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  namespace: gitlab
  labels: {app: gitlab}
  annotations:
    metallb.universe.tf/loadBalancerIPs: "${gitlab_ssh_ip}"
spec:
  type: LoadBalancer
  # Local keeps the real client IP for gitlab-shell auth logs (single pod →
  # its node answers ARP for the LB IP under MetalLB L2)
  externalTrafficPolicy: Local
  selector: {app: gitlab}
  ports:
    - {name: ssh, port: 22, targetPort: ssh}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - gitlab.home.0dl.me
  rules:
    - backendRefs:
        - name: gitlab
          port: 80
      timeouts:
        request: "900s"        # big pushes/clones over HTTPS
        backendRequest: "900s"
---
# Tunnel route — bare gitlab.0dl.me via Cloudflare Tunnel (UI from outside).
# CF terminates TLS at the edge; :80 listener, same as memos/grafana/harbor.
# Note CF's 100MB request cap — big git pushes over HTTPS belong on the LAN
# hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-tunnel
  namespace: gitlab
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - gitlab.0dl.me
  rules:
    - backendRefs:
        - name: gitlab
          port: 80
      timeouts:
        request: "900s"
        backendRequest: "900s"
