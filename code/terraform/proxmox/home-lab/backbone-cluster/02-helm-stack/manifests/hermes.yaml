# hermes — an OFF-CLUSTER app (uvicorn on the pxc_hermes host, 10.0.10.29:9119)
# that we front with the cluster gateway ONLY so it can be gated by the same
# TinyAuth ext_authz as the in-cluster apps. Traffic path after cutover:
#
#   browser -> Cloudflare edge -> cf-tunnel -> gateway 10.0.10.212 (Envoy,
#   TinyAuth ext_authz) -> Service hermes -> EndpointSlice -> 10.0.10.29:9119
#
# The backend is a selector-less Service plus a hand-maintained EndpointSlice
# pointing at the host IP — the standard Gateway API pattern for an external
# origin. hermes keeps its own /login too, so this adds SSO in front of it.
#
# MANUAL (Cloudflare, can't be terraformed): repoint the tunnel public-hostname
# hermes.0dl.me FROM http://10.0.10.29:9119 TO http://10.0.10.212 (gateway IP),
# Path empty. Apply this file FIRST (no user impact — traffic still goes direct
# until the tunnel is repointed), THEN flip the CF route to cut over onto
# TinyAuth. hermes.home.0dl.me already resolves to the gateway via the
# *.home.0dl.me wildcard, so LAN access works as soon as this applies.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Selector-less Service — endpoints come from the EndpointSlice below, not pods.
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
  labels: {app: hermes}
spec:
  ports:
    - {name: http, port: 9119, targetPort: 9119, protocol: TCP}
---
# Manually-managed endpoints pointing at the off-cluster host. The
# kubernetes.io/service-name label binds this slice to the Service above.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes-external
  namespace: hermes
  labels:
    kubernetes.io/service-name: hermes
addressType: IPv4
ports:
  - {name: http, port: 9119, protocol: TCP}
endpoints:
  - addresses: [10.0.10.29]
    conditions: {ready: true}
---
# LAN route — the *.home.0dl.me wildcard cert + DNS already resolve to the
# gateway, so this just needs a hostname match on the https-wildcard listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
  hostnames: [hermes.home.0dl.me]
  rules:
    - backendRefs:
        - {name: hermes, port: 9119}
---
# Tunnel route — bare hermes.0dl.me via Cloudflare Tunnel (HTTP-only at the
# gateway; CF terminates TLS at the edge), so bind the :http listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-tunnel
  namespace: hermes
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames: [hermes.0dl.me]
  rules:
    - backendRefs:
        - {name: hermes, port: 9119}
---
# TinyAuth forward-auth gate (same extAuth shape as tinyauth-securitypolicies.
# yaml). Kept in this file rather than the central one because hermes is a
# self-contained external origin defined entirely here. Requires the hermes
# namespace in the tinyauth ReferenceGrant (manifests/tinyauth.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tinyauth
  namespace: hermes
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: hermes}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: hermes-tunnel}
  extAuth:
    failOpen: false
    headersToExtAuth: [host, cookie, x-forwarded-proto, x-forwarded-host, x-forwarded-for, accept, user-agent]
    http:
      backendRefs:
        - {name: tinyauth, namespace: tinyauth, port: 3001}
