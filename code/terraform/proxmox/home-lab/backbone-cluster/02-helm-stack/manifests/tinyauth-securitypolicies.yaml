---
# trilium/siyuan/zennotes each publish a LAN route + a Cloudflare-tunnel route;
# both are targeted so the app is gated no matter how it's reached.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tinyauth
  namespace: trilium
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: trilium}
