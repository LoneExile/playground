# Envoy Gateway SecurityPolicies that gate the SSO-less apps behind TinyAuth
# (see manifests/tinyauth.yaml). One policy per app namespace; each targets that
# app's HTTPRoute(s) so the blast radius is exactly those hostnames — EG scopes
# an extAuth filter to the targeted routes only, leaving siblings on the same
# Gateway untouched.
#
# extAuth flow: an unauthenticated request is held while EG calls TinyAuth's
# rewrite shim (Service tinyauth/tinyauth:3001, cross-ns per the ReferenceGrant
# in the tinyauth namespace). TinyAuth returns 2xx → request proceeds; 307 →
# the client is bounced to tinyauth.0dl.me/login and, once the .0dl.me session
# cookie is set, every protected host (LAN *.home.0dl.me and public *.0dl.me)
# is satisfied by the same cookie.
#
# failOpen: false → if TinyAuth is unreachable the app stays closed (these are
# private dashboards/notes; fail-closed is the safe default). Break-glass if
# Keycloak/TinyAuth is down: `kubectl delete securitypolicy -n <ns> tinyauth`.
#
# headersToExtAuth lists the client headers EG must include in the check request
# (EG forwards none by default): host (→ redirect-back origin), cookie (session
# lookup), user-agent/accept (browser vs API detection), x-forwarded-* (logging).
# The shim hardcodes X-Forwarded-Proto: https, so the proto here is advisory.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tinyauth
  namespace: pool-monitor
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: pool-monitor}
  extAuth:
    failOpen: false
    headersToExtAuth: [host, cookie, x-forwarded-proto, x-forwarded-host, x-forwarded-for, accept, user-agent]
    http:
      backendRefs:
        - {name: tinyauth, namespace: tinyauth, port: 3001}
---
