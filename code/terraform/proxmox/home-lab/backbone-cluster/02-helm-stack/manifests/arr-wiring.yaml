# Post-apply wiring Job — connects the *arr stack together via each app's REST
# API using the pre-seeded API keys (arr-secrets). Runs IN-cluster because the
# only externally-reachable endpoints are TinyAuth-gated; the internal Service
# DNS is reachable only from inside. Idempotent (checks before every POST) and
# schema-driven (fetches each app's field template so it survives version drift),
# so it is safe to re-run on every apply.
#
# Wires: qBittorrent categories (tv-sonarr, radarr) + Sonarr/Radarr download
# client + root folders (/data/series, /data/movie) + remote-path mapping
# (/downloads → /data/download) + Prowlarr Applications (Sonarr, Radarr fullSync).
#
# NOT wired here (needs a human/one-time): Prowlarr indexers (your specific
# trackers), and Seerr (log in with a Jellyfin admin account, then add Sonarr/
# Radarr with the keys from arr-secrets) — Seerr's media-server link imports the
# Jellyfin admin user and can't be seeded headlessly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arr-wiring-script
  namespace: arr
data:
  wire.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache curl jq >/dev/null 2>&1 || true
    command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1 || { echo "FATAL: curl/jq unavailable (apk egress blocked?)"; exit 1; }

    SONARR=http://sonarr.arr.svc.cluster.local:8989
    RADARR=http://radarr.arr.svc.cluster.local:7878
    PROWLARR=http://prowlarr.arr.svc.cluster.local:9696
    QBIT=http://qbittorrent.torrents.svc.cluster.local:8080
    FLARE=http://flaresolverr.arr.svc.cluster.local:8191

    # Wait for every backend — including qBittorrent and FlareSolverr — before
    # touching them, so the download-client test (dials qbit) and the FlareSolverr
    # proxy test (dials FlareSolverr) aren't run before those backends are up.
    echo "waiting for backends..."
    for u in "$SONARR/ping" "$RADARR/ping" "$PROWLARR/ping" "$QBIT/api/v2/app/version" "$FLARE/"; do
      i=0; until curl -sf "$u" >/dev/null 2>&1; do i=$((i+1)); [ $i -gt 120 ] && { echo "timeout $u"; exit 1; }; sleep 5; done
      echo "ok $u"
    done

    # --- qBittorrent categories (pod is subnet-whitelisted → no login needed) ---
    for c in "tv-sonarr" "radarr"; do
      curl -s "$QBIT/api/v2/torrents/createCategory" --data-urlencode "category=$c" --data-urlencode "savePath=/downloads/$c" >/dev/null 2>&1 || true
    done
    echo "qbit categories ensured"

    # --- Sonarr/Radarr download client (schema-driven) ---
    add_qbit() {
      base=$1; key=$2; cat=$3
      if curl -sf -H "X-Api-Key: $key" "$base/api/v3/downloadclient" | jq -e '.[]|select(.implementation=="QBittorrent")' >/dev/null 2>&1; then
        echo "$base: qbit client exists"; return 0; fi
      tmpl=$(curl -sf -H "X-Api-Key: $key" "$base/api/v3/downloadclient/schema" | jq '[.[]|select(.implementation=="QBittorrent")][0]')
      [ "$tmpl" != "null" ] && [ -n "$tmpl" ] || { echo "$base: no qbit schema"; return 1; }
      payload=$(echo "$tmpl" | jq --arg cat "$cat" '
        .enable=true | .name="qBittorrent" |
        .fields=([.fields[] |
          if .name=="host" then .value="qbittorrent.torrents.svc.cluster.local"
          elif .name=="port" then .value=8080
          elif .name=="useSsl" then .value=false
          elif .name=="username" then .value=""
          elif .name=="password" then .value=""
          elif (.name|test("^(tv|movie)?[Cc]ategory$")) then .value=$cat
          else . end ])')
      curl -sf -H "X-Api-Key: $key" -H 'Content-Type: application/json' -X POST "$base/api/v3/downloadclient" -d "$payload" >/dev/null && echo "$base: qbit client added"
    }
    add_root() {
      base=$1; key=$2; path=$3
      if curl -sf -H "X-Api-Key: $key" "$base/api/v3/rootfolder" | jq -e --arg p "$path" '.[]|select(.path==$p)' >/dev/null 2>&1; then
        echo "$base: root $path exists"; return 0; fi
      curl -sf -H "X-Api-Key: $key" -H 'Content-Type: application/json' -X POST "$base/api/v3/rootfolder" -d "{\"path\":\"$path\"}" >/dev/null && echo "$base: root $path added"
    }
    add_rpm() {
      base=$1; key=$2
      if curl -sf -H "X-Api-Key: $key" "$base/api/v3/remotepathmapping" | jq -e '.[]|select(.remotePath=="/downloads/")' >/dev/null 2>&1; then
        echo "$base: rpm exists"; return 0; fi
      curl -sf -H "X-Api-Key: $key" -H 'Content-Type: application/json' -X POST "$base/api/v3/remotepathmapping" \
        -d '{"host":"qbittorrent.torrents.svc.cluster.local","remotePath":"/downloads/","localPath":"/data/download/"}' >/dev/null && echo "$base: rpm added"
    }

    add_qbit "$SONARR" "$SONARR_API_KEY" "tv-sonarr"
    add_root "$SONARR" "$SONARR_API_KEY" "/data/series"
    add_rpm  "$SONARR" "$SONARR_API_KEY"
    add_qbit "$RADARR" "$RADARR_API_KEY" "radarr"
    add_root "$RADARR" "$RADARR_API_KEY" "/data/movie"
    add_rpm  "$RADARR" "$RADARR_API_KEY"

    # --- Prowlarr Applications (Sonarr + Radarr, fullSync, schema-driven) ---
    add_app() {
      name=$1; impl=$2; appurl=$3; appkey=$4
      if curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR/api/v1/applications" | jq -e --arg n "$name" '.[]|select(.name==$n)' >/dev/null 2>&1; then
        echo "prowlarr: app $name exists"; return 0; fi
      tmpl=$(curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR/api/v1/applications/schema" | jq --arg i "$impl" '[.[]|select(.implementation==$i)][0]')
      [ "$tmpl" != "null" ] && [ -n "$tmpl" ] || { echo "prowlarr: no schema for $impl"; return 1; }
      payload=$(echo "$tmpl" | jq --arg n "$name" --arg bu "$appurl" --arg k "$appkey" '
        .name=$n | .syncLevel="fullSync" |
        .fields=([.fields[] |
          if .name=="prowlarrUrl" then .value="http://prowlarr.arr.svc.cluster.local:9696"
          elif .name=="baseUrl" then .value=$bu
          elif .name=="apiKey" then .value=$k
          else . end ])')
      curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" -H 'Content-Type: application/json' -X POST "$PROWLARR/api/v1/applications" -d "$payload" >/dev/null && echo "prowlarr: app $name added"
    }
    add_app "Sonarr" "Sonarr" "http://sonarr.arr.svc.cluster.local:8989" "$SONARR_API_KEY"
    add_app "Radarr" "Radarr" "http://radarr.arr.svc.cluster.local:7878" "$RADARR_API_KEY"

    # --- Prowlarr FlareSolverr proxy + tag (for Cloudflare-protected indexers) ---
    # Creates the "flaresolverr" tag and a FlareSolverr indexer-proxy carrying it.
    # Prowlarr routes an indexer through FlareSolverr only when the indexer shares
    # this tag, so CF-protected indexers (e.g. 1337x) just need the tag added in
    # the UI — the proxy plumbing is already here.
    ensure_flaresolverr() {
      tagid=$(curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR/api/v1/tag" | jq -r '.[]|select(.label=="flaresolverr")|.id')
      if [ -z "$tagid" ]; then
        tagid=$(curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" -H 'Content-Type: application/json' -X POST "$PROWLARR/api/v1/tag" -d '{"label":"flaresolverr"}' | jq -r '.id')
        echo "prowlarr: tag flaresolverr created ($tagid)"
      else
        echo "prowlarr: tag flaresolverr exists ($tagid)"
      fi
      if curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR/api/v1/indexerproxy" | jq -e '.[]|select(.implementation=="FlareSolverr")' >/dev/null 2>&1; then
        echo "prowlarr: flaresolverr proxy exists"; return 0; fi
      tmpl=$(curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" "$PROWLARR/api/v1/indexerproxy/schema" | jq '[.[]|select(.implementation=="FlareSolverr")][0]')
      [ "$tmpl" != "null" ] && [ -n "$tmpl" ] || { echo "prowlarr: no flaresolverr schema"; return 1; }
      payload=$(echo "$tmpl" | jq --argjson tid "$tagid" '
        .name="FlareSolverr" | .tags=[$tid] |
        .fields=([.fields[] |
          if .name=="host" then .value="http://flaresolverr.arr.svc.cluster.local:8191"
          elif .name=="requestTimeout" then .value=60
          else . end ])')
      curl -sf -H "X-Api-Key: $PROWLARR_API_KEY" -H 'Content-Type: application/json' -X POST "$PROWLARR/api/v1/indexerproxy" -d "$payload" >/dev/null && echo "prowlarr: flaresolverr proxy added"
    }
    ensure_flaresolverr

    echo "wiring complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: arr-wiring
  namespace: arr
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: arr-wiring}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wire
          image: alpine:3.20
          command: ["sh", "/script/wire.sh"]
          env:
            - name: SONARR_API_KEY
              valueFrom: {secretKeyRef: {name: arr-secrets, key: sonarr-api-key}}
            - name: RADARR_API_KEY
              valueFrom: {secretKeyRef: {name: arr-secrets, key: radarr-api-key}}
            - name: PROWLARR_API_KEY
              valueFrom: {secretKeyRef: {name: arr-secrets, key: prowlarr-api-key}}
          volumeMounts:
            - {name: script, mountPath: /script}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      volumes:
        - name: script
          configMap: {name: arr-wiring-script}
