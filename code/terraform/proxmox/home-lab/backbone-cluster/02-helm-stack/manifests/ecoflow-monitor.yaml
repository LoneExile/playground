# EcoFlow monitor — Go service streaming EcoFlow DELTA 3 telemetry, exposing
# /metrics for Prometheus and /state as JSON. Image is built by the project's
# GitLab CI (buildkit) and pushed to Harbor; pulled here with a Harbor
# pull-robot credential (imagePullSecret below).
#
# Secrets: EcoFlow account creds come from the Secret via env (EF_EMAIL,
# EF_PASSWORD). The config file references the EF_EMAIL env placeholder (written
# escaped below) which the app expands from env at load — so no secret is ever
# baked into the ConfigMap.
apiVersion: v1
kind: Namespace
metadata:
  name: ecoflow
  labels:
    # distroless nonroot image, no caps, no host access — clears restricted PSA.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: ecoflow-secrets
  namespace: ecoflow
type: Opaque
data:
  EF_EMAIL: ${ecoflow_email_b64}
  EF_PASSWORD: ${ecoflow_password_b64}
---
# Harbor pull-robot docker credential for the private image.
apiVersion: v1
kind: Secret
metadata:
  name: ecoflow-harbor-pull
  namespace: ecoflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${harbor_pull_dockerconfig_b64}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecoflow-config
  namespace: ecoflow
data:
  config.yaml: |
    ecoflow:
      api_host: api.ecoflow.com        # EU/global partition (Thailand routes here)
      email: $${EF_EMAIL}              # password from EF_PASSWORD env only
      refresh_interval: 12h
      devices:
        - sn: P321ZE1APJ3P0413
          name: delta3-classic
    http:
      addr: ":8080"
    log:
      level: info
    rules: []                          # webhook rules disabled in-cluster
    republish:
      enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoflow-monitor
  namespace: ecoflow
  labels: {app: ecoflow-monitor}
spec:
  replicas: 1
  strategy: {type: Recreate}    # single EcoFlow MQTT session per account
  selector:
    matchLabels: {app: ecoflow-monitor}
  template:
    metadata:
      labels: {app: ecoflow-monitor}
    spec:
      # image is built amd64 by the CI runner (pinned amd64) — schedule to match
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ecoflow-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532            # distroless nonroot uid
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ecoflow-monitor
          image: ${ecoflow_image}
          imagePullPolicy: Always   # :latest tag — pull newest on (re)start
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: EF_EMAIL
              valueFrom: {secretKeyRef: {name: ecoflow-secrets, key: EF_EMAIL}}
            - name: EF_PASSWORD
              valueFrom: {secretKeyRef: {name: ecoflow-secrets, key: EF_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap: {name: ecoflow-config}
---
apiVersion: v1
kind: Service
metadata:
  name: ecoflow-monitor
  namespace: ecoflow
  labels: {app: ecoflow-monitor}
spec:
  type: ClusterIP
  selector: {app: ecoflow-monitor}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Prometheus scrape — kube-prometheus-stack picks up ServiceMonitors from all
# namespaces (serviceMonitorSelectorNilUsesHelmValues: false).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecoflow-monitor
  namespace: ecoflow
  labels:
    app: ecoflow-monitor
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: ecoflow-monitor}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# LAN view of the JSON API + metrics at ecoflow.home.0dl.me (wildcard cert).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecoflow-monitor
  namespace: ecoflow
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: https-wildcard
  hostnames:
    - ecoflow.home.0dl.me
  rules:
    - backendRefs:
        - name: ecoflow-monitor
          port: 8080
