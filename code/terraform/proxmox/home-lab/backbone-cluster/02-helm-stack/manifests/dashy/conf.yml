# Dashy dashboard for the Backbone Cluster — all services, grouped, with icons.
# Inlined into the `dashy-conf` ConfigMap in manifests/dashy.yaml (templatefile +
# indent in apps.tf) and mounted read-only over /app/user-data/conf.yml, so this
# file is the source of truth (edit here + terraform apply, not in-app).
#
# Auth: Keycloak via generic OIDC (homelab realm, public client "dashy",
# redirect auth-code + PKCE). enableSilentRenew:false keeps it iframe-free, so
# no realm-wide X-Frame-Options / CSP changes are needed for the cross-origin
# (dashy.0dl.me ↔ keycloak.0dl.me) setup. Client is created in dashy.tf.
# Icons: brand logos come from CDN icon packs resolved in the browser, so they
# don't depend on each service's own host being reachable/unauthenticated (the
# old `favicon` approach broke once services moved behind the Keycloak/TinyAuth
# SSO gate — the favicon endpoint returns the login page, not the logo). Prefixes:
#   hl-<name>  dashboard-icons (homarr-labs), coloured SVG logos
#   sh-<name>  selfh.st icons, used where dashboard-icons has no slug
#   mdi-<name> Material Design glyphs for the custom apps that have no brand logo
# `favicon` is kept only for the personal blog (public, no auth).

pageInfo:
  title: Homelab
  description: 0dl.me self-hosted services
  navLinks:
    - title: Grafana
      path: https://grafana.0dl.me
    - title: GitLab
      path: https://gitlab.0dl.me

appConfig:
  theme: nord-frost
  layout: auto
  iconSize: medium
  statusCheck: true
  statusCheckInterval: 300
  faviconApi: allesedv
  preventWriteToDisk: true          # conf.yml is a read-only ConfigMap
  disableConfigurationForNonAdmin: true
  # No enableGuestAccess key: with auth configured, guest/anonymous view is off by
  # default, so a Keycloak login is required. (The key is rejected at appConfig
  # level by the 4.3.14 schema — the upstream docs are ahead of the release.)
  auth:
    enableOidc: true
    oidc:
      clientId: dashy
      endpoint: https://keycloak.0dl.me/realms/homelab   # issuer URL (homelab realm)
      scope: openid profile email
      enableSilentRenew: false      # redirect-only; avoids the cross-origin renew iframe

