# ZenNotes — keyboard-first Markdown notes app, self-hosted web mode
# (https://github.com/ZenNotes/zennotes). Fresh install — no existing data.
#
# Storage model is plain files, NOT a database: notes live as Markdown in the
# "vault" (CONTENT_ROOT), server config + bootstrap state live in DATA.
#   - home/syncthing/data1/TheBox -> /workspace  (the Markdown vault)
#   - config/zennotes/data        -> /data       (server.json, runtime config)
#
# The vault is a SYNCTHING folder (home/syncthing/data1/TheBox, has a .stfolder
# marker), shared with the syncthing service. This makes the same vault sync
# across the user's machines: edit on a laptop, Syncthing replicates to the NAS,
# the server reads/writes the same files. Only the vault is synced — /data
# (server.json) stays server-local under config/zennotes/data, never synced.
#
# Image is pinned by sha256 digest because tags (latest / 2.8 / 2.8.0) are
# mutable on Docker Hub and we want reproducible rebuilds. Bump the tag and the
# digest together when upgrading; the digest is the security guarantee, the tag
# is for humans. Image is multi-arch (amd64 + arm64) so it can land on the Pi
# worker too.
#
# Auth — ZenNotes is secure-by-default: it requires a bootstrap auth token. We
# generate one (openssl rand -hex 32), store it in a Secret, and inject it via
# ZENNOTES_AUTH_TOKEN. The browser asks for the token once, then switches to an
# HttpOnly session cookie. Sessions are in-memory, so they reset on pod restart
# (re-enter the token); the token itself is stable. Do NOT set
# ZENNOTES_ALLOW_INSECURE_NOAUTH — that disables auth entirely.
#
# ZENNOTES_ALLOWED_ORIGINS is a hard CSRF-style allowlist: the server rejects
# browser requests whose Origin isn't listed. It MUST contain every hostname
# the app is reached on, or the UI silently fails to load data. Both the LAN
# and tunnel origins are listed. ZENNOTES_BEHIND_TLS=1 makes the server mark
# cookies Secure + emit HSTS (correct since the browser always reaches us over
# HTTPS — gateway TLS on LAN, Cloudflare edge TLS on the tunnel).
#
# Why runAsUser: 0 — the NAS share dirs are root-owned (same as memos/siyuan);
# baseline PSA allows root without privileged. ZenNotes writes notes 0600 and
# dirs 0700 as the running user, which is fine on the root-owned share.
#
# Single replica + Recreate: the vault is plain files on NFS; a second writer
# racing the file watcher could clobber notes. Keep it to one.
#
# Exposure: LAN via *.home.0dl.me wildcard cert + bare 0dl.me via Cloudflare
# Tunnel (HTTP-only at the gateway, TLS terminated at the CF edge). Same shape
# as memos / siyuan / trilium.
#
# Post-apply manual follow-ups (Cloudflare side, can't be terraformed here):
#   1. Cloudflare DNS: add CNAME `zennotes.0dl.me` -> `<tunnel-id>.cfargotunnel.com`
#      (reuse the tunnel ID memos/siyuan/trilium already use).
#   2. Cloudflare Tunnel "Published application routes" UI:
#        Subdomain: zennotes / Domain: 0dl.me / Path: empty (match all paths)
#        Service: HTTP -> 10.0.10.212  (gateway external IP)
#      The empty Path is critical — a leftover path regex blocks everything.
#   3. Open https://zennotes.home.0dl.me, paste the token from terraform.tfvars
#      (zennotes_auth_token) when prompted, then start writing.

apiVersion: v1
kind: Namespace
metadata:
  name: zennotes
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: zennotes-nas
spec:
  capacity: {storage: 15Ti}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, nolock, noatime]
  nfs:
    server: 192.168.1.179
    path: /zpool1/nfs_share
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zennotes-nas
  namespace: zennotes
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: zennotes-nas
  resources:
    requests: {storage: 15Ti}
---
apiVersion: v1
kind: Secret
metadata:
  name: zennotes-secrets
  namespace: zennotes
type: Opaque
stringData:
  auth-token: "${zennotes_auth_token}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zennotes
  namespace: zennotes
  labels: {app: zennotes}
spec:
  replicas: 1
  strategy: {type: Recreate}    # plain-file vault on NFS — single writer only
  selector:
    matchLabels: {app: zennotes}
  template:
    metadata:
      labels: {app: zennotes}
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: zennotes
          image: adibhanna/zennotes:2.8.0@sha256:3dcef81d83edb3dd67b3d6342aaf10f5e78275bf9631f0606eb090429f39a6f7
          ports:
            - {name: http, containerPort: 7878}
          env:
            - {name: TZ, value: Asia/Bangkok}
            - {name: ZENNOTES_BIND, value: "0.0.0.0:7878"}
            - {name: ZENNOTES_CONFIG_PATH, value: /data/server.json}
            - {name: ZENNOTES_DEFAULT_VAULT_PATH, value: /workspace}
            - {name: ZENNOTES_BROWSE_ROOTS, value: /workspace}
            - {name: ZENNOTES_ALLOWED_ORIGINS, value: "https://zennotes.home.0dl.me,https://zennotes.0dl.me"}
            - {name: ZENNOTES_BEHIND_TLS, value: "1"}
            - {name: ZENNOTES_ALLOW_INSECURE_NOAUTH, value: "0"}
            - name: ZENNOTES_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zennotes-secrets
                  key: auth-token
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: nas, mountPath: /workspace, subPath: home/syncthing/data1/TheBox}
            - {name: nas, mountPath: /data, subPath: config/zennotes/data}
          # tcpSocket probes — with auth on, HTTP paths return 401/redirects, so
          # an httpGet probe is unreliable. A TCP check on the listener is enough
          # for a single-process Go server. Same approach as memos / siyuan.
          readinessProbe:
            tcpSocket: {port: 7878}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 7878}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: zennotes-nas
---
apiVersion: v1
kind: Service
metadata:
  name: zennotes
  namespace: zennotes
  labels: {app: zennotes}
spec:
  type: ClusterIP
  selector: {app: zennotes}
  ports:
    - {name: http, port: 7878, targetPort: http}
---
# LAN route — TLS terminated at the gateway via the *.home.0dl.me wildcard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zennotes
  namespace: zennotes
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
  hostnames:
    - zennotes.home.0dl.me
  rules:
    - backendRefs:
        - name: zennotes
          port: 7878
---
# Tunnel route — bare zennotes.0dl.me via Cloudflare Tunnel. HTTP-only at the
# gateway (CF terminates TLS at the edge), so bind to the :http listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zennotes-tunnel
  namespace: zennotes
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - zennotes.0dl.me
  rules:
    - backendRefs:
        - name: zennotes
          port: 7878
