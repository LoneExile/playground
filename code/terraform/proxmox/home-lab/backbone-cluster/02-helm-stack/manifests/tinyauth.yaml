# TinyAuth — forward-auth / ext_authz gateway for apps that have no OIDC of
# their own (pool/ecoflow/image-gen dashboards, trilium/siyuan/zennotes notes).
# Envoy Gateway SecurityPolicy.extAuth on each protected HTTPRoute calls this
# service; it authenticates the user against Keycloak (generic OIDC provider,
# GitHub-brokered, owner-only) and only then lets the request through.
#
# ── Why the PUBLIC host (tinyauth.<primary_domain>, not *.home) ──────────────
# TinyAuth's session cookie is scoped to APPURL's registrable domain. Running it
# at tinyauth.0dl.me scopes the cookie to `.0dl.me`, which covers BOTH the LAN
# hosts (*.home.0dl.me) and the Cloudflare-tunnel hosts (*.0dl.me) — one SSO for
# every protected app regardless of how it's reached. An unauthenticated hit on
# e.g. pool.home.0dl.me redirects to tinyauth.0dl.me, logs in once, and the
# `.0dl.me` cookie satisfies every sibling.
#
# ── Talking to Keycloak ─────────────────────────────────────────────────────
# All three OIDC endpoints use the public keycloak host so the issuer the pod
# sees (KC_HOSTNAME_STRICT=false → issuer follows request host) matches the one
# the browser used at /auth — no iss mismatch. The pod egresses to the CF edge
# and back for token/userinfo; a small hairpin, but correctness beats latency.
# TinyAuth's generic provider does NO .well-known discovery, so auth/token/
# userinfo URLs are all given explicitly.
#
# ── State (sqlite) ──────────────────────────────────────────────────────────
# v5 keeps sessions + local users in a sqlite DB (no TINYAUTH_SECRET anymore).
# Single writer → single replica, Recreate, RWO PVC on nfs-client.
#
# ── MANUAL (Cloudflare, can't be terraformed) ───────────────────────────────
# Add a Zero Trust tunnel public-hostname: tinyauth / 0dl.me / (empty path) →
# HTTP → 10.0.10.212 (gateway IP), plus the matching CNAME
# tinyauth.0dl.me → <tunnel-id>.cfargotunnel.com. Same as the other *.0dl.me
# tunnel hosts. Until that entry exists, the browser can't reach tinyauth and
# every protected app redirect will dead-end.
apiVersion: v1
kind: Namespace
metadata:
  name: tinyauth
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tinyauth-data
  namespace: tinyauth
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Secret
metadata:
  name: tinyauth-secrets
  namespace: tinyauth
type: Opaque
data:
  # base64encode()d in apps.tf (keeps any secret charset YAML-safe). Consumed
  # via secretKeyRef ENV below — never inlined into the Deployment's plaintext
  # env. Same value as the Keycloak `tinyauth` client (var.tinyauth_oidc_client_secret).
  oidc-client-secret: "${tinyauth_oidc_client_secret_b64}"
---
# ext_authz path-rewrite shim. Envoy Gateway's SecurityPolicy.extAuth.http
# APPENDS the original request path to the configured prefix (a hit on
# pool.home.0dl.me/metrics reaches the auth service at /api/auth/envoy/metrics),
# and EG exposes no knob to disable that (envoyproxy/gateway#5783). TinyAuth's
# auth endpoint is a fixed gin route `/api/auth/:proxy`: it 404s on the extra
# segment and 301s (trailing slash) on the bare-root case, so every check would
# be denied. This nginx sidecar fronts TinyAuth on :3001, rewrites ANY path to
# exactly /api/auth/envoy, and preserves the two things TinyAuth reads to build
# the redirect-back: the original Host (c.Request.Host) and X-Forwarded-Proto.
# The browser-facing tunnel route still talks to TinyAuth directly on :3000;
# only the ext_authz check goes through here. Verified empirically: without this
# shim EG's append yields 404 (/metrics) / 301 (/); with it, 307 → tinyauth login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tinyauth-extauth-nginx
  namespace: tinyauth
data:
  default.conf: |
    server {
      listen 3001;
      server_name _;
      # An auth decision needs no request body; POSTs can be large.
      client_max_body_size 0;
      location / {
        # $host = the original Host Envoy forwards (e.g. pool.home.0dl.me or
        # trilium.0dl.me) → becomes c.Request.Host in TinyAuth, which builds the
        # redirect-back URL from it.
        proxy_set_header Host              $host;
        # Hardcode https: every protected host is https to the end user (LAN via
        # the *.home.0dl.me wildcard cert, public via the Cloudflare edge), but
        # the tunnel (:80) listener would otherwise hand ext_authz proto=http and
        # TinyAuth would emit an http:// login/redirect that Keycloak rejects and
        # that can't set a Secure cookie. The ext_authz check runs before any
        # HTTPRoute header filter, so this shim is the only place to force it.
        proxy_set_header X-Forwarded-Proto https;
        # Collapse whatever segment EG appended to the single fixed endpoint;
        # `break` stops the bare proxy_pass from re-appending anything.
        rewrite ^ /api/auth/envoy break;
        proxy_pass http://127.0.0.1:3000;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyauth
  namespace: tinyauth
  labels: {app: tinyauth}
spec:
  replicas: 1
  strategy: {type: Recreate}    # single sqlite writer on NFS
  selector:
    matchLabels: {app: tinyauth}
  template:
    metadata:
      labels: {app: tinyauth}
    spec:
      containers:
        - name: tinyauth
          image: ghcr.io/tinyauthapp/tinyauth:v5
          ports:
            - {name: http, containerPort: 3000}
          env:
            # External URL — sets the .0dl.me cookie scope + default redirect.
            - {name: TINYAUTH_APPURL, value: "https://${tinyauth_host}"}
            # Secure flag on the session cookie (we're always https end-to-end).
            - {name: TINYAUTH_AUTH_SECURECOOKIE, value: "true"}
            # Trust X-Forwarded-* only from the Envoy gateway pods (pod CIDR).
            - {name: TINYAUTH_AUTH_TRUSTEDPROXIES, value: "${trusted_proxies}"}
            - {name: TINYAUTH_DATABASE_PATH, value: "/data/tinyauth.db"}
            # Only this email may complete a login (global OAuth whitelist).
            - {name: TINYAUTH_OAUTH_WHITELIST, value: "${tinyauth_owner_email}"}
            # Skip the local-login form; go straight to Keycloak. Break-glass if
            # Keycloak is ever down: `kubectl delete securitypolicy -n <app> …`
            # removes the gate for that app.
            - {name: TINYAUTH_OAUTH_AUTOREDIRECT, value: "generic"}
            # --- generic OIDC provider "generic" (→ /api/oauth/callback/generic) ---
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_NAME, value: "Keycloak"}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_CLIENTID, value: "tinyauth"}
            - name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_CLIENTSECRET
              valueFrom:
                secretKeyRef: {name: tinyauth-secrets, key: oidc-client-secret}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_AUTHURL,     value: "https://${keycloak_host}/realms/homelab/protocol/openid-connect/auth"}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_TOKENURL,    value: "https://${keycloak_host}/realms/homelab/protocol/openid-connect/token"}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_USERINFOURL, value: "https://${keycloak_host}/realms/homelab/protocol/openid-connect/userinfo"}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_SCOPES,      value: "openid email profile"}
            - {name: TINYAUTH_OAUTH_PROVIDERS_GENERIC_REDIRECTURL, value: "https://${tinyauth_host}/api/oauth/callback/generic"}
            # debug for the initial ext_authz roll-out (empirical header/host
            # verification on pool-monitor); drop to info once proven.
            - {name: TINYAUTH_LOG_LEVEL, value: "debug"}
            # --- UI branding: match the custom Keycloak login theme ---------------
            # TinyAuth's only native theming knobs are the login-screen title and the
            # background image (no custom-CSS/colour/logo support). Both SSO screens
            # share the SAME forest wallpaper as the Keycloak homelab login theme
            # (themes/homelab/login/login.ftl). Here the image is SELF-HOSTED: a webp
            # of that Unsplash photo ships in the tinyauth-bg ConfigMap (assets/
            # homelab-bg.webp, see tinyauth-bg.tf), mounted at RESOURCES_PATH and
            # served by TinyAuth's file server under the /resources/ URL prefix (the
            # default /background.jpg is instead a frontend-bundled asset) — so the
            # background is /resources/homelab-bg.webp. No CDN hotlink, smaller
            # payload, no egress. The card itself stays TinyAuth's stock dark card.
            - {name: TINYAUTH_UI_TITLE, value: "Homelab"}
            - {name: TINYAUTH_RESOURCES_PATH, value: "/resources"}
            - {name: TINYAUTH_UI_BACKGROUNDIMAGE, value: "/resources/homelab-bg.webp"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            # Self-hosted login wallpaper (webp) served from the resources dir.
            - {name: bg, mountPath: /resources, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 30
            failureThreshold: 5
        # ext_authz path-rewrite shim (see the ConfigMap above). Only the
        # SecurityPolicy check traffic hits :3001; it rewrites → localhost:3000.
        - name: extauth-rewrite
          image: nginx:1.27-alpine
          ports:
            - {name: extauth, containerPort: 3001}
          resources:
            requests: {cpu: 5m, memory: 12Mi}
            limits: {memory: 48Mi}
          volumeMounts:
            - {name: extauth-nginx, mountPath: /etc/nginx/conf.d}
          readinessProbe:
            tcpSocket: {port: 3001}
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tinyauth-data}
        - name: extauth-nginx
          configMap: {name: tinyauth-extauth-nginx}
        # Binary webp wallpaper, shipped from repo via tinyauth-bg.tf (kubernetes_
        # config_map_v1 binary_data). Kept out of this manifest so the base64 blob
        # doesn't bloat the templated YAML — same split as the Keycloak theme.
        - name: bg
          configMap: {name: tinyauth-bg}
---
apiVersion: v1
kind: Service
metadata:
  name: tinyauth
  namespace: tinyauth
  labels: {app: tinyauth}
spec:
  type: ClusterIP
  selector: {app: tinyauth}
  ports:
    # Browser-facing UI + OAuth callback — the tunnel HTTPRoute targets this.
    - {name: http, port: 3000, targetPort: http}
    # ext_authz path-rewrite shim — per-app SecurityPolicies target this.
    - {name: extauth, port: 3001, targetPort: extauth}
---
# Tunnel route — tinyauth.0dl.me via Cloudflare Tunnel. CF terminates TLS at the
# edge and forwards http to the gateway's :80 listener, so bind :http and force
# X-Forwarded-Proto: https — otherwise TinyAuth (SECURECOOKIE + https callback)
# would see http and emit an http:// redirect_uri that Keycloak rejects (same
# fix as keycloak / sftpgo / chat).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tinyauth-tunnel
  namespace: tinyauth
spec:
  parentRefs:
    - name: backbone-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - ${tinyauth_host}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Proto, value: https}
      backendRefs:
        - name: tinyauth
          port: 3000
---
# Cross-namespace grant: the protected apps live in their own namespaces, so
# each app's SecurityPolicy.extAuth.http.backendRefs → tinyauth Service is a
# cross-namespace reference and Gateway API requires a ReferenceGrant in the
# TARGET (tinyauth) namespace naming the source namespaces + kind. Added up
# front so the per-app SecurityPolicies (rolled out next) attach cleanly.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-securitypolicy-to-tinyauth
  namespace: tinyauth
spec:
  from:
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: pool-monitor}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: ecoflow}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: image-gen}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: trilium}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: siyuan}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: zennotes}
    # SSO-less apps that had their own local login, folded behind TinyAuth: the
    # syncthing GUI (device-sync protocol on a separate Service is unaffected) and
    # the torrents stack (qBittorrent WebUI + qui manager; qui reaches qBittorrent
    # over the in-cluster Service, so gating the ingress doesn't touch it).
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: syncthing}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: torrents}
    # Off-cluster hermes app fronted by the gateway (manifests/hermes.yaml).
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: hermes}
  to:
    - {group: "", kind: Service, name: tinyauth}
